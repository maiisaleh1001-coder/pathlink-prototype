<script>
(function () {
  // ?app=1 is the installed app's start_url; remember it for the session so later pages keep the app layout
  var app = /[?&]app=1/.test(location.search);
  try { if (app) sessionStorage.setItem('pl-app', '1'); else app = sessionStorage.getItem('pl-app') === '1'; } catch (e) {}
  var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true || app;
  if (standalone) document.documentElement.classList.add('standalone');
  // home goes through the splash once per session (before anything paints, so there is no flash)
  var file = location.pathname.split('/').pop() || 'index.html';
  var seen = false; try { seen = sessionStorage.getItem('pl-intro-seen') === 'true'; } catch (e) {}
  if (file === 'index.html' && !seen && !/[?&]skip/.test(location.search)) {
    try { sessionStorage.setItem('pl-intro-seen', 'true'); } catch (e) {}
    location.replace('splash.html' + (standalone ? '?app=1' : ''));
  }
})();
</script>

<style>
@font-face{font-family:"Thmanyah Sans";src:url("fonts/thmanyahsans-Regular.otf") format("opentype");font-weight:400;font-display:swap}
@font-face{font-family:"Thmanyah Sans";src:url("fonts/thmanyahsans-Medium.otf") format("opentype");font-weight:500;font-display:swap}
@font-face{font-family:"Thmanyah Sans";src:url("fonts/thmanyahsans-Bold.otf") format("opentype");font-weight:700;font-display:swap}
body{margin:0;background:#04070B}
a{color:#CBB9FF;text-decoration:none}
.scr{position:relative;width:390px;height:844px;overflow:hidden;background:#04070B;color:#F8FAFC;font-family:'Thmanyah Sans',Tajawal,sans-serif;direction:rtl;isolation:isolate}
.aura{position:absolute;border-radius:999px;filter:blur(70px);pointer-events:none;z-index:0}
.stars{position:absolute;pointer-events:none;z-index:0}
.scroll{position:relative;z-index:1;height:100%;overflow-y:auto;box-sizing:border-box;padding:18px 16px 120px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll > *{flex-shrink:0}
.bar{display:flex;align-items:center;gap:10px}
.ib{width:42px;height:42px;flex:none;border-radius:999px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.05);color:#F8FAFC;display:flex;align-items:center;justify-content:center;box-sizing:border-box;position:relative}
.ttl{flex-grow:1;text-align:center;font-size:17px;font-weight:700}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.card{background:linear-gradient(160deg,rgba(255,255,255,.065),rgba(255,255,255,.018));border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;color:#F8FAFC;box-sizing:border-box;position:relative;overflow:hidden}
.gb{border:1px solid transparent;background:linear-gradient(#0C0F17,#0C0F17) padding-box,linear-gradient(120deg,#6C5CE7,#F168FF) border-box}
.gt{background:linear-gradient(100deg,#CBB9FF 0%,#8B7CF6 45%,#F168FF 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.h{font-size:15px;font-weight:700}
.sec{font-size:17px;font-weight:700}
.sub{font-size:12px;color:rgba(248,250,252,.55);line-height:18px}
.txt{font-size:13px;line-height:22px;color:rgba(248,250,252,.72)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex-grow:1;min-width:0;display:flex;flex-direction:column}
.av{width:44px;height:44px;flex:none;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;position:relative;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pill{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;flex:none}
.p-ok{background:rgba(74,222,128,.12);color:#86EFAC}.p-warn{background:rgba(251,191,36,.12);color:#FCD34D}.p-bad{background:rgba(248,113,113,.13);color:#FCA5A5}.p-info{background:rgba(139,124,246,.18);color:#CBB9FF}.p-mute{background:rgba(255,255,255,.07);color:rgba(248,250,252,.72)}
.chip{height:36px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.04);color:rgba(248,250,252,.8);font-size:13px;display:inline-flex;align-items:center;gap:6px;box-sizing:border-box;cursor:pointer;white-space:nowrap}
.chip.on{background:linear-gradient(90deg,#6C5CE7,#F168FF);border-color:transparent;color:#FFFFFF;font-weight:700}
.tag{height:26px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.06);color:rgba(248,250,252,.78);font-size:12px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.lbl{font-size:13px;font-weight:700}
.field{height:50px;border-radius:999px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);display:flex;align-items:center;gap:10px;padding:0 16px;font-size:14px;color:#F8FAFC;box-sizing:border-box}
.field .ph{color:rgba(248,250,252,.45);flex-grow:1}
.btn{height:54px;border-radius:999px;background:linear-gradient(90deg,#6C5CE7,#F168FF);color:#FFFFFF;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;border:0;font-family:inherit;cursor:pointer}
.btn2{height:54px;border-radius:999px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#F8FAFC;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;box-sizing:border-box;font-family:inherit;cursor:pointer}
.btn-s{height:36px;padding:0 16px;border-radius:999px;background:linear-gradient(90deg,#6C5CE7,#F168FF);color:#FFFFFF;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;flex:none}
.btn-s2{height:36px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#F8FAFC;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;flex:none;box-sizing:border-box}
.foot{position:absolute;right:0;left:0;bottom:0;z-index:3;display:flex;gap:10px;padding:14px 16px 26px;background:rgba(8,10,16,.78);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.07)}
.foot > *{flex:1}
.ic{width:40px;height:40px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center}
.dv{height:1px;background:rgba(255,255,255,.08);flex:none}
.note{display:flex;align-items:flex-start;gap:8px;padding:11px 13px;border-radius:16px;font-size:12px;line-height:19px}
.n-info{background:rgba(139,124,246,.12);color:#CBB9FF;border:1px solid rgba(139,124,246,.18)}.n-warn{background:rgba(251,191,36,.08);color:#FCD34D;border:1px solid rgba(251,191,36,.16)}
.rail{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none;flex:none}
.rail::-webkit-scrollbar{display:none}
.rail > *{flex:none}
.shead{display:flex;align-items:center;gap:8px}
.shead .sec{flex-grow:1;font-size:16px}
.hist{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px;color:#F8FAFC}
.hist:last-child{border-bottom:0}
.kv{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:rgba(248,250,252,.62);padding:6px 0}
.kv b{color:#F8FAFC;font-weight:700}
.match{--p:86;width:64px;height:64px;flex:none;border-radius:999px;background:conic-gradient(from 0deg,#6C5CE7,#F168FF calc(var(--p)*1%),rgba(255,255,255,.08) 0);display:flex;align-items:center;justify-content:center}
.match > span{width:52px;height:52px;border-radius:999px;background:#0C0F17;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
.live{width:8px;height:8px;border-radius:999px;background:#F168FF;box-shadow:0 0 0 4px rgba(241,104,255,.18);flex:none;animation:pl-pulse 1.6s ease-in-out infinite}
@keyframes pl-pulse{0%,100%{box-shadow:0 0 0 3px rgba(241,104,255,.25)}50%{box-shadow:0 0 0 7px rgba(241,104,255,0)}}
.drop-pill{transform:rotate(var(--r,0deg));animation:pl-drop 1s cubic-bezier(.25,1.35,.45,1) both}
@keyframes pl-drop{0%{transform:translateY(-460px) rotate(0deg);opacity:0}45%{opacity:1}100%{transform:translateY(0) rotate(var(--r,0deg));opacity:1}}
.float{animation:pl-float 6s ease-in-out infinite}
@keyframes pl-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.shine{background-size:200% 100%;animation:pl-shine 2.4s linear infinite}
@keyframes pl-shine{0%{background-position:100% 0}100%{background-position:-100% 0}}
@media (prefers-reduced-motion:reduce){.drop-pill,.float,.live,.shine{animation:none}}
</style>
</head>
