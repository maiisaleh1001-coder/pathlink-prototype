body{margin:0}
a{color:#1F6FEB;text-decoration:none}a:hover{color:#0E2A47}
.scr{position:relative;width:390px;height:844px;overflow:hidden;background:#F9FAFB;color:#15202B;font-family:'Thmanyah Sans',Tajawal,sans-serif;direction:rtl}
.scroll{height:100%;overflow-y:auto;box-sizing:border-box;padding:18px 16px 120px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll > *{flex-shrink:0}
.bar{display:flex;align-items:center;gap:10px}
.ib{width:42px;height:42px;flex:none;border-radius:999px;border:1px solid #E8EBEF;background:#FFFFFF;color:#15202B;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.ttl{flex-grow:1;text-align:center;font-size:17px;font-weight:700}
.card{background:#FFFFFF;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;color:#15202B}
.h{font-size:15px;font-weight:700}
.sec{font-size:17px;font-weight:700}
.sub{font-size:12px;color:#6B7684;line-height:18px}
.txt{font-size:13px;line-height:22px;color:#3F4A57}
.row{display:flex;align-items:center;gap:12px}
.grow{flex-grow:1;min-width:0;display:flex;flex-direction:column}
.av{width:44px;height:44px;flex:none;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;flex:none}
.p-ok{background:#E6F4EC;color:#1E7F4F}.p-warn{background:#FDF3DC;color:#8A5A00}.p-bad{background:#FCEBEA;color:#C2362F}.p-info{background:#E6EEFF;color:#1F6FEB}.p-mute{background:#F2F4F7;color:#3F4A57}.p-auto{background:#EFEAFD;color:#5B3FA8}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 14px;border-radius:999px;border:1px solid #E8EBEF;background:#FFFFFF;color:#15202B;font-size:13px;display:inline-flex;align-items:center;gap:6px;box-sizing:border-box;cursor:pointer}
.chip.on{background:#1F6FEB;border-color:#1F6FEB;color:#FFFFFF;font-weight:700}
.tag{height:26px;padding:0 10px;border-radius:999px;background:#F2F4F7;font-size:12px;display:inline-flex;align-items:center;gap:4px}
.lbl{font-size:13px;font-weight:700}
.field{height:48px;border-radius:14px;border:1px solid #E8EBEF;background:#FFFFFF;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:14px;color:#15202B;box-sizing:border-box}
.field .ph{color:#8A94A0;flex-grow:1}
.field .v{flex-grow:1}
.area{min-height:92px;border-radius:14px;border:1px solid #E8EBEF;background:#FFFFFF;padding:12px 14px;font-size:14px;line-height:22px;color:#15202B;box-sizing:border-box}
.fg{display:flex;flex-direction:column;gap:8px}
.btn{height:54px;border-radius:999px;background:#1F6FEB;color:#FFFFFF;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;border:0;font-family:inherit;cursor:pointer}
.btn2{height:54px;border-radius:999px;border:1px solid #E8EBEF;background:#FFFFFF;color:#15202B;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;box-sizing:border-box;font-family:inherit;cursor:pointer}

.btn-s2{height:36px;padding:0 14px;border-radius:999px;border:1px solid #E8EBEF;background:#FFFFFF;color:#15202B;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;flex:none;box-sizing:border-box}
.foot{position:absolute;right:0;left:0;bottom:0;display:flex;gap:10px;padding:14px 16px 26px;background:#FFFFFF;box-shadow:0 -6px 18px rgba(21,32,43,.08);border-radius:26px 26px 0 0}
.foot > *{flex:1}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:18px;background:#1F6FEB;color:#FFFFFF;display:flex;flex-direction:column;gap:10px}
.hero::before{content:"";position:absolute;top:-80px;left:-80px;width:230px;height:230px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05)}
.hero::after{content:"";position:absolute;top:-34px;left:-34px;width:140px;height:140px;border-radius:999px;border:1px solid rgba(255,255,255,.18)}
.hero > *{position:relative;z-index:1}
.hero .sub{color:rgba(255,255,255,.85)}
.ring{width:64px;height:64px;flex:none;border-radius:999px;display:flex;align-items:center;justify-content:center}

.ring.sm{width:46px;height:46px}.ring.sm > span{width:36px;height:36px;font-size:12px}
.seg{display:flex;padding:4px;border-radius:999px;background:#EEF0F3}
.seg a{flex:1;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#3F4A57}
.seg a.on{background:#FFFFFF;color:#15202B;font-weight:700;box-shadow:0 1px 3px rgba(21,32,43,.12)}

.tog.off{background:#D5DAE1}.tog.off::after{left:21px}
.dv{height:1px;background:#EEF0F3;flex:none}
.ic{width:38px;height:38px;flex:none;border-radius:999px;display:flex;align-items:center;justify-content:center}

.rail{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none;flex:none}
.rail::-webkit-scrollbar{display:none}
.rail > *{flex:none}
.sheet{position:absolute;right:0;left:0;bottom:0;display:flex;flex-direction:column;gap:14px;padding:10px 16px 26px;border-radius:28px 28px 0 0;background:#FFFFFF;max-height:88%;box-sizing:border-box;overflow-y:auto;scrollbar-width:none}
.handle{align-self:center;width:40px;height:4px;border-radius:999px;background:#DADDE2;flex:none}
.dim{position:absolute;inset:0;background:rgba(14,26,43,.48)}
.tl{display:flex;flex-direction:column;gap:0}
.tl > div{display:flex;gap:12px;align-items:flex-start;padding-bottom:16px;position:relative}
.tl > div:not(:last-child)::before{content:"";position:absolute;right:11px;top:24px;bottom:0;width:2px;background:#E8EBEF}
.tl > div.done:not(:last-child)::before{background:#1F6FEB}
.dot{width:24px;height:24px;flex:none;border-radius:999px;background:#E8EBEF;color:#FFFFFF;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.done .dot{background:#1F6FEB}
.now .dot{background:#FFFFFF;border:2px solid #1F6FEB;box-sizing:border-box}
.range{position:relative;height:28px;margin:0 11px}
.range .tr{position:absolute;left:0;right:0;top:12px;height:4px;border-radius:999px;background:#E8EBEF}
.range .sel{position:absolute;top:12px;height:4px;border-radius:999px;background:#1F6FEB}
.range .kn{position:absolute;top:3px;width:22px;height:22px;margin-right:-11px;border-radius:999px;background:#FFFFFF;border:2px solid #1F6FEB;box-sizing:border-box;box-shadow:0 2px 6px rgba(21,32,43,.15)}
.minmax{display:flex;gap:10px;align-items:center}.minmax .field{flex:1;height:44px}
.search{height:48px;border-radius:999px;border:1.5px solid #1F6FEB;background:#FFFFFF;display:flex;align-items:center;gap:8px;padding:0 16px;box-sizing:border-box;flex-grow:1;color:#6B7684}
.search input{flex:1;border:0;outline:0;background:transparent;font-family:inherit;font-size:14px;color:#15202B;min-width:0}
.hist{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #EEF0F3;font-size:14px;color:#15202B}
.hist:last-child{border-bottom:0}
.shead{display:flex;align-items:center;gap:8px}
.shead .sec{flex-grow:1;font-size:16px}
.mini{display:flex;flex-direction:column;border-radius:20px;background:#FFFFFF;overflow:hidden;color:#15202B}
.thumb{height:86px;display:flex;align-items:center;justify-content:center;font-size:12px}
